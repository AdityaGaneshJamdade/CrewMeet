name: nexcord
description: "ChaiChu - Community chat, voice, and video platform built with Flutter."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Data Modeling & JSON Serialization
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0

  # Backend & Realtime
  supabase_flutter: ^2.8.4

  # Real-Time Voice, Video & Screen Share
  livekit_client: ^2.3.4

  # Notifications
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Configuration & Utilities
  flutter_dotenv: ^5.2.1
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.15
  riverpod_generator: ^2.6.4
  freezed: ^2.5.8
  json_serializable: ^6.9.4

flutter:
  uses-material-design: true
  assets:
    - .env
